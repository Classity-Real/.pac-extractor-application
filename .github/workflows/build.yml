name: Build PExt-Application

# Manual trigger only — go to the Actions tab, click "Run workflow", and fill
# in a version + your own changelog text. That build then gets published as
# a GitHub Release with the APK attached.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version/tag (e.g. v1.2.0)'
        required: true
        type: string
      changelog:
        description: 'Changelog for this release (shown as the release notes)'
        required: true
        type: string

env:
  # Pinned to match the Gradle version verified working in Codespaces (sdkman's
  # default), so Actions and local dev builds against the exact same toolchain
  # instead of whatever setup-gradle auto-detects.
  GRADLE_VERSION: "9.4.0"

permissions:
  contents: write

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle distribution and dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle-dist
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ env.GRADLE_VERSION }}-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ env.GRADLE_VERSION }}-${{ runner.os }}-

      - name: Download and install Gradle ${{ env.GRADLE_VERSION }}
        run: |
          if [ ! -d "$HOME/.gradle-dist/gradle-${GRADLE_VERSION}" ]; then
            mkdir -p "$HOME/.gradle-dist"
            curl -fsSL -o /tmp/gradle.zip "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
            unzip -q /tmp/gradle.zip -d "$HOME/.gradle-dist"
            rm /tmp/gradle.zip
          fi
          echo "$HOME/.gradle-dist/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Verify Gradle install
        run: gradle --version

      - name: Run Android Lint
        run: gradle lintDebug --no-daemon

      - name: Run unit tests
        run: gradle testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pext-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-*.html
          if-no-files-found: ignore

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      # Only reached if lint/tests/build above all succeeded. Creates the tag if it
      # doesn't already exist, and uses the changelog text you typed into the
      # "Run workflow" form as the release notes — no auto-generated notes here.
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_NOTES: ${{ inputs.changelog }}
        run: |
          printf '%s\n' "$RELEASE_NOTES" > release_notes.md
          gh release create "$RELEASE_VERSION" \
            app/build/outputs/apk/debug/app-debug.apk \
            --title "$RELEASE_VERSION" \
            --notes-file release_notes.md