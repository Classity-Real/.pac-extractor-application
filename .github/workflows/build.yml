name: Build PExt Application

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 2.0.3) — release tag AND app versionName'
        required: true
        type: string
      changelog:
        description: 'Changelog for this release'
        required: true
        type: string
      build_type:
        description: 'Build type'
        required: true
        type: choice
        options:
          - debug
          - release
        default: debug
      apk_name:
        description: 'Base filename for the output APK'
        required: true
        type: string
        default: 'PExt'

env:
  GRADLE_VERSION: "9.4.0"

permissions:
  contents: write

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-read-only: false
          cache-cleanup: on-success

      - name: Cache Android build intermediates
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/build-cache
            ~/.gradle/caches/transforms-*
            ~/.gradle/caches/build-cache-*
          key: android-build-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/gradle.properties') }}
          restore-keys: |
            android-build-${{ runner.os }}-

      - name: Compute version properties
        id: version
        run: |
          RAW="${{ inputs.version }}"
          RAW="${RAW#v}"
          RAW="${RAW#V}"
          IFS='.' read -r MA MI PA REST <<< "${RAW}.0.0.0"
          MA=${MA:-0}; MI=${MI:-0}; PA=${PA:-0}
          MA=${MA//[^0-9]/}; MI=${MI//[^0-9]/}; PA=${PA//[^0-9]/}
          MA=${MA:-0}; MI=${MI:-0}; PA=${PA:-0}
          RUN=${{ github.run_number }}
          CODE=$(( MA * 1000000 + MI * 1000 + PA * 10 + (RUN % 10) ))
          if [ "$CODE" -lt 100 ]; then CODE=$((100 + RUN)); fi
          echo "version_name=$RAW" >> "$GITHUB_OUTPUT"
          echo "version_code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Computed versionName=$RAW versionCode=$CODE"

      - name: Run Android Lint
        run: >
          gradle lint${{ inputs.build_type == 'release' && 'Release' || 'Debug' }} --build-cache
          -PappVersionName=${{ steps.version.outputs.version_name }}
          -PappVersionCode=${{ steps.version.outputs.version_code }}

      - name: Run unit tests
        run: >
          gradle test${{ inputs.build_type == 'release' && 'Release' || 'Debug' }}UnitTest --build-cache
          -PappVersionName=${{ steps.version.outputs.version_name }}
          -PappVersionCode=${{ steps.version.outputs.version_code }}

      - name: Build ${{ inputs.build_type }} APK
        run: >
          gradle assemble${{ inputs.build_type == 'release' && 'Release' || 'Debug' }} --build-cache
          -PappVersionName=${{ steps.version.outputs.version_name }}
          -PappVersionCode=${{ steps.version.outputs.version_code }}

      - name: Rename output APK
        id: apk
        run: |
          SRC="app/build/outputs/apk/${{ inputs.build_type }}/app-${{ inputs.build_type }}.apk"
          OUT_NAME="${{ inputs.apk_name }}-${{ steps.version.outputs.version_name }}.apk"
          cp "$SRC" "$OUT_NAME"
          echo "apk_path=$OUT_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.apk_name }}-${{ steps.version.outputs.version_name }}
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: warn

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-*.html
          if-no-files-found: ignore

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/test${{ inputs.build_type == 'release' && 'Release' || 'Debug' }}UnitTest/
          if-no-files-found: ignore

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.version.outputs.version_name }}
          RELEASE_NOTES: ${{ inputs.changelog }}
          APK_PATH: ${{ steps.apk.outputs.apk_path }}
        run: |
          printf '%s\n' "$RELEASE_NOTES" > release_notes.md
          if gh release view "$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "Release $RELEASE_VERSION exists — updating assets and notes"
            gh release upload "$RELEASE_VERSION" "$APK_PATH" --clobber
            gh release edit "$RELEASE_VERSION" --notes-file release_notes.md --title "$RELEASE_VERSION"
          else
            gh release create "$RELEASE_VERSION" "$APK_PATH" \
              --title "$RELEASE_VERSION" \
              --notes-file release_notes.md
          fi
